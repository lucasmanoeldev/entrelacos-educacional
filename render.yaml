# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Cria recursos pagos no Render. Revise os planos antes de confirmar o Blueprint.
projects:
  - name: entrelacos
    environments:
      - name: production
        databases:
          - name: entrelacos-db
            databaseName: entrelacos
            user: entrelacos
            plan: basic-256mb
            diskSizeGB: 1
            postgresMajorVersion: '17'
            region: oregon
            ipAllowList: []
        services:
          - type: web
            name: entrelacos-api
            runtime: python
            region: oregon
            plan: starter
            rootDir: backend
            buildCommand: pip install -r requirements.lock && python manage.py collectstatic --noinput
            preDeployCommand: python manage.py migrate --noinput
            startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 150
            healthCheckPath: /api/v1/health/
            envVars:
              - key: PYTHON_VERSION
                value: 3.12.14
              - key: DEBUG
                value: 'false'
              - key: SECRET_KEY
                generateValue: true
              - key: DATABASE_URL
                fromDatabase:
                  name: entrelacos-db
                  property: connectionString
              - key: FRONTEND_URL
                sync: false
              - key: CORS_ALLOWED_ORIGINS
                sync: false
              - key: NVIDIA_API_KEY
                sync: false
              - key: NVIDIA_MODEL
                value: deepseek-ai/deepseek-v4-flash-0731
              - key: EMAIL_BACKEND
                value: django.core.mail.backends.smtp.EmailBackend
              - key: EMAIL_HOST
                value: smtp.gmail.com
              - key: EMAIL_PORT
                value: '587'
              - key: EMAIL_USE_TLS
                value: 'true'
              - key: EMAIL_USE_SSL
                value: 'false'
              - key: EMAIL_TIMEOUT
                value: '20'
              - key: EMAIL_HOST_USER
                sync: false
              - key: EMAIL_HOST_PASSWORD
                sync: false
              - key: DEFAULT_FROM_EMAIL
                sync: false
