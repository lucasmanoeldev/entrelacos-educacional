# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Teste gratuito: SQLite temporario; dados podem sumir em reinicios/deploys.
services:
  - type: web
    name: entrelacos-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.lock && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 150
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DEBUG
        value: 'false'
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_SQLITE
        value: 'true'
      - key: DATABASE_URL
        value: sqlite:////tmp/entrelacos.sqlite3
      - key: FRONTEND_URL
        value: http://localhost:3000
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: deepseek-ai/deepseek-v4-flash-0731
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.dummy.EmailBackend
