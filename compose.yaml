services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: entrelacos
      POSTGRES_USER: entrelacos
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U entrelacos]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    ports:
      - '8000:8000'
    environment:
      DEBUG: 'true'
      SECRET_KEY: local-development-only
      DATABASE_URL: postgresql://entrelacos:local-development-only@db:5432/entrelacos
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 150"
volumes:
  postgres_data:
